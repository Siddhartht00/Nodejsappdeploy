<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node.js Jenkins App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #1f2937);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            color: #111827;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 18px;
        }

        .status {
            background: #f3f4f6;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }

        .footer {
            margin-top: 30px;
            color: #6b7280;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🚀 Node.js Application</h1>

        <p class="subtitle">
            Frontend + Backend deployed using Jenkins
        </p>

        <div class="status">
            <h2>Jenkins Deployment</h2>
            <p>Application is running successfully.</p>
        </div>

        <button onclick="checkServer()">
            Check Server
        </button>

        <div id="result"></div>

        <div class="footer">
            Node.js + Express + Jenkins
        </div>

    </div>

    <script>
        async function checkServer() {
            const result = document.getElementById("result");

            try {
                const response = await fetch("/api/status");
                const data = await response.json();

                result.innerHTML = "✅ " + data.message;
            } catch (error) {
                result.innerHTML = "❌ Server connection failed";
            }
        }
    </script>

</body>
</html>
